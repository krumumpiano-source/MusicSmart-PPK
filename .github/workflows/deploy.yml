name: Deploy MusicSmart to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax checks
        run: |
          for f in app/sw.js app/js/*.js app/data/*.js google_apps_script.js; do node --check "$f"; done
          python tools/sync_apps_script_template.py --check

      - name: Tests (sample roster only)
        env:
          USE_SAMPLE_DATA: '1'
        run: |
          node tests/test_quiz_shuffle.js
          python tests/test_lessons.py
          python tests/test_students.py
          node test_e2e_suite.js
          node tests/test_sync.js
          node tests/test_student_auth_gas.js
          node tests/test_student_portal.js
          node tests/test_student_submit_gas.js
          node tests/test_student_submit_client.js
          for t in tests/test_phase*.js; do node "$t"; done
          node tools/curriculum/build_wk5_data.js --check
          node tests/test_wk5_form.js
          node tests/test_student_guide_data.js
          node tests/test_lesson_editor_wk5.js
          node tests/test_semester_single_source.js
          node tests/test_password_security.js
          node tools/curriculum/build_kalimba_media.js --check
          node tools/curriculum/build_period_media.js --check
          node tests/test_kalimba_notes.js
          node tests/test_kalimba_media.js
          node tests/test_period_media.js
          node tools/curriculum/build_ensemble_data.js --check
          node tests/test_period_e2e.js
          node tests/test_wk5_notes_m1.js
          node tests/test_song_note_coverage.js
          node tests/test_local_server.js
          node tests/test_period_folders.js
          node tests/test_ensemble_explorer.js
          node tests/test_timbre_listening.js
          node tests/test_feldman_nofake.js
          node tests/test_gas_version_check.js

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site (sample roster only, no real student data)
        run: |
          rm -rf _site
          cp -r app _site
          # PDPA: the public site must never contain the real roster
          cp app/data/students.sample.js _site/data/students.js
          rm -f _site/data/students.sample.js
          # Stamp service worker cache with commit so every deploy refreshes clients
          sed -i "s/^const APP_VERSION = '\(.*\)';/const APP_VERSION = '\1-${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "STUDENTS_IS_SAMPLE = true" _site/data/students.js
          grep -n "APP_VERSION" _site/sw.js

      - name: Legacy-browser transpile (only the deployed copy, source untouched)
        run: |
          npm i --no-save esbuild acorn
          node tools/build/build_legacy.js _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
