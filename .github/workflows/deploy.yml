name: Deploy MusicSmart to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run full test suite (all JS, Python, curriculum checks, and Cloudflare Worker tests)
        env:
          USE_SAMPLE_DATA: '1'
        run: |
          node tests/run_all.js
          node tools/curriculum/build_wk5_data.js --check
          node tools/curriculum/build_kalimba_media.js --check
          node tools/curriculum/build_period_media.js --check
          node tools/curriculum/build_ensemble_data.js --check
          npm --prefix cloudflare-api test

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site (sample roster only, no real student data)
        run: |
          rm -rf _site
          cp -r app _site
          # PDPA: the public site must never contain the real roster
          cp app/data/students.sample.js _site/data/students.js
          rm -f _site/data/students.sample.js
          # Security: strip quiz answer keys & explanations from public static site
          node tools/build/strip_quiz_answers.js _site/data/quizzes.js
          grep -q "QUIZZES_ANSWERS_STRIPPED = true" _site/data/quizzes.js
          # Stamp service worker cache with commit so every deploy refreshes clients
          sed -i "s/^const APP_VERSION = '\(.*\)';/const APP_VERSION = '\1-${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "STUDENTS_IS_SAMPLE = true" _site/data/students.js
          grep -n "APP_VERSION" _site/sw.js

      - name: Legacy-browser transpile (only the deployed copy, source untouched)
        run: |
          npm i --no-save esbuild acorn
          node tools/build/build_legacy.js _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
