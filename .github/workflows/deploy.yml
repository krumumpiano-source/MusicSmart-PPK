name: Deploy MusicSmart to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax checks
        run: |
          for f in app/sw.js app/js/*.js app/data/*.js google_apps_script.js; do node --check "$f"; done
          python tools/sync_apps_script_template.py --check

      - name: Tests (sample roster only)
        env:
          USE_SAMPLE_DATA: '1'
        run: |
          # Runs every tests/test_*.js|py + test_e2e_suite.js (see tests/run_all.js)
          node tests/run_all.js
          # Generated-data freshness checks
          node tools/curriculum/build_wk5_data.js --check
          node tools/curriculum/build_kalimba_media.js --check
          node tools/curriculum/build_period_media.js --check
          node tools/curriculum/build_ensemble_data.js --check

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site (sample roster only, no real student data)
        run: |
          rm -rf _site
          cp -r app _site
          # PDPA: the public site must never contain the real roster
          cp app/data/students.sample.js _site/data/students.js
          rm -f _site/data/students.sample.js
          # Stamp service worker cache with commit so every deploy refreshes clients
          sed -i "s/^const APP_VERSION = '\(.*\)';/const APP_VERSION = '\1-${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "STUDENTS_IS_SAMPLE = true" _site/data/students.js
          grep -n "APP_VERSION" _site/sw.js

      - name: Legacy-browser transpile (only the deployed copy, source untouched)
        run: |
          npm i --no-save esbuild acorn
          node tools/build/build_legacy.js _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
